# Check and test the extension and build its package for every push to main
# and every pull request. The job installs the locked development tools,
# checks the types, runs the tests and packages the VSIX with vsce, which
# first bundles the extension with esbuild and also validates the manifest and
# the README. The VSIX stays a workflow artifact for inspection. The job
# "release rules" checks the release rules of CONTRIBUTING.md in the source
# (scripts/release-checks.mjs). This workflow publishes nothing: the release
# workflow calls it for the commit of a version and publishes the VSIX of that
# call. A change of this file changes the release process: its pull request
# needs a dry run (rule 4).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow calls this workflow for the commit of a version,
  # because its push of that commit starts no workflow.
  workflow_call:
    inputs:
      ref:
        description: The commit to test and package; empty for the commit of the event.
        type: string
        required: false
        default: ''

permissions:
  # Checkout needs repository reads; the checks get no write scope.
  contents: read

jobs:
  check:
    name: Test and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up the pinned Node release
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install the locked development tools without install scripts
        run: npm ci --ignore-scripts

      - name: Check the types
        run: npm run typecheck

      - name: Run the tests
        run: npm test

      - name: Build the VSIX package
        run: npm run package

      - name: Keep the VSIX package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error

  release-rules:
    # Rules 1, 2 and 5 of CONTRIBUTING.md: the extension ID follows the naming scheme and is the ID of the last release,
    # and only the workflow "Release" publishes, with the sign-in to Microsoft Entra ID, and deletes no extension.
    name: release rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up the pinned Node release
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Check the extension ID and the publishing steps
        run: node scripts/release-checks.mjs rules
